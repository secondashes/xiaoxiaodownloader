<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>下载管理</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      user-select: none;
      color: #e0e0e6;
    }
    .panel {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.02) 35%, rgba(120,200,255,0.09) 60%, rgba(255,255,255,0.05)),
        linear-gradient(160deg, rgba(40,40,48,0.90), rgba(20,20,24,0.88));
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 14px;
      overflow: hidden;
      backdrop-filter: blur(10px);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.30),
        inset 0 -1px 0 rgba(255,255,255,0.08),
        0 20px 60px rgba(0, 0, 0, 0.6);
    }
    /* 镜面扫光 */
    .panel::after {
      content: '';
      position: absolute;
      top: -20%;
      left: -80%;
      width: 45%;
      height: 140%;
      background: linear-gradient(100deg, transparent, rgba(255,255,255,0.16), transparent);
      transform: skewX(-20deg);
      animation: panelShine 5s ease-in-out infinite;
      pointer-events: none;
      z-index: 9999;
    }
    @keyframes panelShine {
      0%, 55% { left: -80%; }
      100% { left: 140%; }
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid #2d2d33;
      -webkit-app-region: drag;
    }
    .title {
      font-size: 14px;
      font-weight: 600;
      color: #e0e0e6;
      flex: 1;
    }
    .shutdown {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #a0a0a8;
      -webkit-app-region: no-drag;
      cursor: pointer;
    }
    .shutdown input {
      cursor: pointer;
    }
    .close {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      color: #7f7f7f;
      font-size: 16px;
      border-radius: 50%;
      cursor: pointer;
      -webkit-app-region: no-drag;
    }
    .close:hover {
      color: #e0e0e6;
      background: #3a3a44;
    }
    .body {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
    }
    .body::-webkit-scrollbar { width: 10px; }
    .body::-webkit-scrollbar-thumb { background: #4a4a55; border-radius: 5px; }
    .body::-webkit-scrollbar-track { background: transparent; }
    .empty {
      text-align: center;
      color: #5f5f5f;
      font-size: 13px;
      padding: 40px 0;
    }
    .task {
      background: #26262b;
      border: 1px solid #2d2d33;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }
    .task-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .tag {
      font-size: 11px;
      padding: 1px 8px;
      border-radius: 10px;
      flex-shrink: 0;
    }
    .tag.pending { background: #2a4a3a; color: #63e2b7; }
    .tag.running { background: #2a4a3a; color: #63e2b7; }
    .tag.paused { background: #4a4020; color: #f0a020; }
    .tag.completed { background: #1f4a2f; color: #18a058; }
    .tag.failed { background: #4a2020; color: #d03050; }
    .tag.cancelled { background: #333; color: #888; }
    .album {
      flex: 1;
      min-width: 0;
      font-size: 13px;
      color: #e0e0e6;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .count {
      font-size: 12px;
      color: #7f7f7f;
      flex-shrink: 0;
    }
    .task-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }
    .btn {
      border: 1px solid #3a3a44;
      background: #2a2a30;
      color: #c0c0c8;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 5px;
      cursor: pointer;
    }
    .btn:hover { border-color: #63e2b7; color: #63e2b7; }
    .btn.danger:hover { border-color: #d03050; color: #d03050; }
    .bar {
      height: 4px;
      background: #2d2d33;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 6px;
    }
    .bar-fill {
      height: 100%;
      background: #63e2b7;
      border-radius: 2px;
      transition: width 0.3s ease;
    }
    .files {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .file {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
    }
    .file-name {
      flex: 1;
      min-width: 0;
      color: #a0a0a8;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .file-speed {
      color: #63e2b7;
      font-family: monospace;
      flex-shrink: 0;
    }
    .file-status {
      flex-shrink: 0;
      color: #7f7f7f;
    }
    .file-status.downloading { color: #63e2b7; }
    .file-status.completed { color: #18a058; }
    .file-status.failed { color: #d03050; }
    .file-status.paused { color: #f0a020; }
    .file-bar {
      height: 3px;
      background: #2d2d33;
      border-radius: 2px;
      overflow: hidden;
      margin-left: 0;
    }
    .file-bar-fill {
      height: 100%;
      background: #63e2b7;
      border-radius: 2px;
    }
    .ctx-menu {
      position: fixed;
      z-index: 9999;
      min-width: 130px;
      background: #2a2a30;
      border: 1px solid #3a3a44;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      padding: 4px;
    }
    .ctx-item {
      padding: 8px 12px;
      font-size: 12px;
      color: #e0e0e6;
      border-radius: 5px;
      cursor: pointer;
    }
    .ctx-item:hover {
      background: #3a3a44;
      color: #63e2b7;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="header">
      <span class="title">下载管理</span>
      <label class="shutdown">
        <input type="checkbox" id="shutdown" /> 下载完关机
      </label>
      <button class="close" id="close" title="关闭">×</button>
    </div>
    <div class="body" id="body"></div>
  </div>

  <div class="ctx-menu" id="ctxMenu" style="display:none">
    <div class="ctx-item" id="ctxDetail">查看详细</div>
  </div>

  <script>
    let tasks = []
    const body = document.getElementById('body')
    const shutdownEl = document.getElementById('shutdown')
    const closeEl = document.getElementById('close')

    function formatSize(bytes) {
      if (bytes == null) return ''
      if (bytes === 0) return '0 B'
      const units = ['B', 'KB', 'MB', 'GB', 'TB']
      const i = Math.floor(Math.log(bytes) / Math.log(1024))
      return (bytes / Math.pow(1024, i)).toFixed(1) + ' ' + units[i]
    }

    function statusText(s) {
      const m = { pending: '等待', running: '下载中', paused: '已暂停', completed: '已完成', failed: '失败', cancelled: '已取消' }
      return m[s] || s
    }
    function fileStatusText(s) {
      const m = { pending: '等待', downloading: '下载中', paused: '暂停', completed: '完成', failed: '失败' }
      return m[s] || s
    }

    function taskPercent(t) {
      const total = t.total || 1
      return Math.round(((t.done || 0) / total) * 100)
    }

    function render() {
      if (tasks.length === 0) {
        body.innerHTML = '<div class="empty">暂无下载任务</div>'
        return
      }
      let html = ''
      for (const t of tasks) {
        const canPause = t.status === 'running' || t.status === 'pending'
        const canResume = t.status === 'paused'
        const canCancel = ['running', 'paused', 'pending'].includes(t.status)
        html += '<div class="task" data-task-id="' + t.id + '">'
        html += '<div class="task-head">'
        html += '<span class="tag ' + t.status + '">' + statusText(t.status) + '</span>'
        html += '<span class="album" title="' + escapeHtml(t.album) + '">' + escapeHtml(t.album) + '</span>'
        html += '<span class="count">' + (t.done || 0) + '/' + (t.total || 0) + '</span>'
        html += '<div class="task-actions">'
        if (canPause) html += '<button class="btn" data-act="pause" data-id="' + t.id + '">暂停</button>'
        if (canResume) html += '<button class="btn" data-act="resume" data-id="' + t.id + '">继续</button>'
        if (canCancel) html += '<button class="btn danger" data-act="cancel" data-id="' + t.id + '">取消</button>'
        html += '<button class="btn danger" data-act="remove" data-id="' + t.id + '">删除</button>'
        html += '</div></div>'
        html += '<div class="bar"><div class="bar-fill" style="width:' + taskPercent(t) + '%"></div></div>'
        html += '<div class="files">'
        for (const f of t.files || []) {
          const pct = f.status === 'completed' ? 100 : (f.completed || 0)
          html += '<div class="file">'
          html += '<span class="file-name" title="' + escapeHtml(f.filename) + '">' + escapeHtml(f.filename) + '</span>'
          if (f.speed) html += '<span class="file-speed">' + formatSize(f.speed) + '/s</span>'
          html += '<span class="file-status ' + f.status + '">' + fileStatusText(f.status) + '</span>'
          html += '</div>'
          html += '<div class="file-bar"><div class="file-bar-fill" style="width:' + pct + '%"></div></div>'
        }
        html += '</div></div>'
      }
      body.innerHTML = html

      // 绑定操作按钮
      body.querySelectorAll('.btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const act = btn.dataset.act
          const id = btn.dataset.id
          const api = window.downloadsApi
          if (!api) return
          if (act === 'pause') api.pauseTask(id)
          else if (act === 'resume') api.resumeTask(id)
          else if (act === 'cancel') api.cancelTask(id)
          else if (act === 'remove') api.removeTask(id)
        })
      })

      // 绑定任务项：双击 / 右键 -> 在主窗口打开详细内容
      body.querySelectorAll('.task').forEach((taskEl) => {
        const id = taskEl.dataset.taskId
        taskEl.addEventListener('dblclick', () => {
          if (window.downloadsApi) window.downloadsApi.openDetail(id)
        })
        taskEl.addEventListener('contextmenu', (e) => {
          e.preventDefault()
          e.stopPropagation()
          showContextMenu(e.clientX, e.clientY, id)
        })
      })
    }

    // 自定义右键菜单
    const ctxMenu = document.getElementById('ctxMenu')
    const ctxDetail = document.getElementById('ctxDetail')
    let ctxTaskId = null
    function showContextMenu(x, y, taskId) {
      ctxTaskId = taskId
      ctxMenu.style.left = x + 'px'
      ctxMenu.style.top = y + 'px'
      ctxMenu.style.display = 'block'
    }
    ctxDetail.addEventListener('click', () => {
      ctxMenu.style.display = 'none'
      if (ctxTaskId && window.downloadsApi) {
        window.downloadsApi.openDetail(ctxTaskId)
      }
    })
    window.addEventListener('click', () => {
      ctxMenu.style.display = 'none'
    })
    window.addEventListener('blur', () => {
      ctxMenu.style.display = 'none'
    })

    function escapeHtml(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
    }

    if (window.downloadsApi && window.downloadsApi.onEvent) {
      window.downloadsApi.onEvent((event) => {
        if (event.event === 'tasks_snapshot') {
          tasks = event.tasks || []
          render()
        } else if (event.event === 'file_progress' && event.task_id) {
          const t = tasks.find((x) => x.id === event.task_id)
          if (t) {
            const f = t.files.find((x) => x.status === 'downloading')
            if (f) {
              f.completed = event.completed
              f.speed = event.speed || 0
              render()
            }
          }
        }
      })
    }

    shutdownEl.addEventListener('change', () => {
      if (window.downloadsApi) window.downloadsApi.toggleShutdown(shutdownEl.checked)
    })
    closeEl.addEventListener('click', () => {
      if (window.downloadsApi) window.downloadsApi.close()
    })
  </script>
</body>
</html>
