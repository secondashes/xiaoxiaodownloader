<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>工作面板</title>
  <style>
    body {
      font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      margin: 0;
      padding: 32px;
      line-height: 1.6;
    }
    .header {
      border-bottom: 1px solid #d2d2d7;
      padding-bottom: 16px;
      margin-bottom: 24px;
    }
    .title { font-size: 22px; font-weight: 600; margin: 0; }
    .subtitle { font-size: 13px; color: #6e6e73; margin-top: 4px; }
    .placeholder {
      text-align: center;
      color: #86868b;
      padding: 64px 0;
      font-size: 14px;
    }
    .icon { font-size: 64px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="header">
    <h1 class="title">工作面板</h1>
    <div class="subtitle">小小下载器后台运行中</div>
  </div>
  <div class="placeholder">
    <div class="icon">📄</div>
    <p>这是拟态模式的占位页面。</p>
    <p>在主程序"设置 → 拟态模式"里上传 txt / word / pdf / 图片 等文件<br>作为伪装面板显示内容。</p>
  </div>
</body>
</html>
